<svg width="1500" height="380" viewBox="0 0 1500 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="55%" stop-color="#0D1220"/>
      <stop offset="100%" stop-color="#0A0E17"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1500" height="380" fill="url(#bg)"/>
  <circle cx="1250" cy="90" r="220" fill="url(#glow)"/>
  <circle cx="180" cy="320" r="180" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.5">
    <line x1="0" y1="60" x2="1500" y2="60"/>
    <line x1="0" y1="320" x2="1500" y2="320"/>
  </g>

  <!-- neural / traffic network motif, top right -->
  <g stroke="#334155" stroke-width="1.4" fill="none" opacity="0.9">
    <path id="p1" d="M 1080 60 L 1180 110 L 1280 70 L 1400 130" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" from="0" to="24" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path id="p2" d="M 1100 200 L 1220 160 L 1330 210 L 1430 170" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#5EEAD4">
    <circle cx="1080" cy="60" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="1280" cy="70" r="4"><animate attributeName="opacity" values="1;0.3;1" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="1400" cy="130" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#F472B6">
    <circle cx="1180" cy="110" r="4"><animate attributeName="opacity" values="1;0.3;1" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="1220" cy="160" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="1330" cy="210" r="4"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- traffic-light pulse, bottom left, quiet nod to her domain work -->
  <g transform="translate(70,240)">
    <rect x="0" y="0" width="26" height="70" rx="8" fill="#111827" stroke="#334155"/>
    <circle cx="13" cy="16" r="7" fill="#F43F5E"><animate attributeName="opacity" values="1;0.15;0.15;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="13" cy="35" r="7" fill="#FBBF24"><animate attributeName="opacity" values="0.15;0.15;1;0.15" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="13" cy="54" r="7" fill="#34D399"><animate attributeName="opacity" values="0.15;1;0.15;0.15" dur="3.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- pulse ring, subtle "vitals" nod to medical AI -->
  <g transform="translate(150,300)" opacity="0.85">
    <polyline points="0,10 20,10 30,-14 45,28 58,10 90,10" fill="none" stroke="#5EEAD4" stroke-width="2">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
    </polyline>
  </g>

  <!-- code-comment style eyebrow -->
  <text x="70" y="140" font-family="Consolas, Menlo, monospace" font-size="18" fill="#5EEAD4" opacity="0.85">// initializing profile.py</text>

  <!-- main title -->
  <text x="68" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="url(#titleGrad)">Hi, I'm Juhi</text>

  <!-- subtitle with typing cursor -->
  <text x="70" y="240" font-family="Consolas, Menlo, monospace" font-size="20" fill="#94A3B8">AI/ML developer building systems that see, reason &amp; decide</text>
  <rect x="742" y="225" width="10" height="20" fill="#5EEAD4">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <text x="70" y="270" font-family="Consolas, Menlo, monospace" font-size="14" fill="#475569">status: online · currently training on ML · GenAI · RAG · AI Agents</text>
</svg>
